<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#162325"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><title>Augmentor Agent</title></head><body>
<form id="pair"><h1>Augmentor Agent</h1><p>Mit deiner Desktop-Oberfläche verbinden.</p><label for="key">Kopplungsschlüssel</label><input id="key" type="password" autocomplete="off" required><button>Verbinden</button><a href="/third-party.txt" target="_blank" rel="noopener">Drittanbieter-Hinweise</a></form>
<div id="screen" aria-label="Live Augmentor Desktop" tabindex="0" hidden></div>
<footer id="remote" hidden><button id="keyboard" aria-label="Telefontastatur einblenden">Tastatur</button><button id="show">App anzeigen</button><button id="clipboard">Kopieren</button><button id="disconnect">Trennen</button></footer>
<div id="keyboard-tools" hidden><button id="select-all">Alles auswählen</button><button id="backspace">Rücktaste</button><button id="enter">Eingabe</button><button id="hide-keyboard">Tastatur ausblenden</button></div>
<textarea id="keyboard-input" aria-label="Fernbedien-Tastatur" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<button id="reconnect" hidden>Neu verbinden</button>
<p id="status" role="status">Verbinde…</p><script type="module" src="/app.js"></script></body></html>
