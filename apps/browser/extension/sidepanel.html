<html lang="de">
<head>
<meta charset="utf-8">
<title>Augmentor Agent</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="vendor/marked.min.js"></script>
<!-- Theme + color restore must be a file, not inline: MV3's default
     extension-page CSP (script-src 'self') blocks inline scripts in
     extension pages. theme-tokens.js first: theme-boot.js uses its math. -->
<script src="theme-tokens.js"></script>
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="theme-base.css">
<link rel="stylesheet" href="sidepanel.css">
<link rel="stylesheet" href="prompt-library.css">
<link rel="stylesheet" href="markdown.css">
<link rel="stylesheet" href="chat-components.css">
<link rel="stylesheet" href="surface-tokens.css">
<link rel="stylesheet" href="surface-layout.css">

</head>
<body>
<div id="app">
  <header>
    <div class="identity"><span id="title" title="Doppelklick zum Umbenennen">Neue Unterhaltung</span></div>
    <nav id="window-actions" aria-label="Unterhaltungssteuerung">
      <button id="newchat" class="hbtn" title="Neue Unterhaltung · Rechtsklick für den Freigabemodus" aria-label="Neue Unterhaltung">＋</button>
      <button id="save" class="hbtn" title="Diese Unterhaltung speichern" aria-label="Diese Unterhaltung speichern">☆</button>
      <button id="sessions" class="hbtn" title="Unterhaltungsverlauf" aria-label="Unterhaltungsverlauf">☰</button>
      <button id="more" class="hbtn" title="Weitere Optionen" aria-label="Weitere Optionen" aria-haspopup="menu" aria-expanded="false">⋯</button>
      <button id="hide" class="hbtn" title="Augmentor ausblenden" aria-label="Augmentor ausblenden">×</button>
    </nav>
  </header>
  <div id="logwrap">
    <div id="log"></div>
  </div>
  <div id="composer-dock">
    <div id="composer-field">
      <textarea id="input" rows="1" placeholder="Augmentor fragen…" aria-label="Nachrichtenentwurf"></textarea>
      <button id="improve" title="Prompt verbessern" aria-label="Prompt verbessern" disabled>✦</button>
    </div>
  </div>
  <footer id="strip">
    <button id="model" hidden title="Modell wechseln" aria-haspopup="dialog"><span id="model-label"></span><span class="model-chev" aria-hidden="true">▾</span></button>
    <span id="connection-dot" role="status" aria-label="Verbinden" title="Verbinden">●</span>
    <span id="voice-seat"></span>
    <button id="top" class="hbtn" title="Zur neuesten Nachricht" aria-label="Zur neuesten Nachricht">↓</button>
    <button id="send" class="hbtn" title="Senden · Eingabe (Umschalt+Eingabe für eine neue Zeile)" aria-label="Senden" disabled>↑</button>
    <button id="stop" class="hbtn" hidden title="Aktuellen Durchlauf stoppen" aria-label="Aktuellen Durchlauf stoppen">■</button>
  </footer>
  <div id="surface-status" class="sr-only" role="status" aria-live="polite"></div>
  <div id="more-menu" hidden role="menu" aria-label="Weitere Optionen">
    <button id="settings" role="menuitem" data-section="">Einstellungen</button>
    <button role="menuitem" data-section="appearance">Farben &amp; Designs</button>
    <button role="menuitem" data-section="prompts">Prompt-Bibliothek</button>
    <button role="menuitem" data-section="harnesses">Modell verbinden</button>
    <button role="menuitem" data-section="models">Modelle &amp; Anbieter</button>
    <button role="menuitem" data-section="support">Versionen &amp; Updates</button>
    <button id="approval-menu-item" role="menuitem">Freigabemodus</button>
    <button role="menuitem" data-section="support">Info &amp; Lizenzen</button>
    <hr><button id="hide-menu-item" role="menuitem">Augmentor ausblenden</button>
  </div>
</div>
<!-- Model picker popover (opened by the #model chip in the strip): the DSH
     app's model catalog, rows rendered by sidepanel.js. The search field
     filters rows live (model name/id or provider name, DSH
     model-picker-augmented parity); when that plugin's settings carry a
     pinned list, a Pinned section renders on top of the provider groups.
     The footer's Refresh button forces a fresh bridge catalog fetch (pins
     included): the SW serves the handshake's memory copy otherwise, and the
     DSH app's model set can change while the panel is open (a model added
     to settings.yaml). -->
<div id="modelpop" hidden role="dialog" aria-label="Modell wählen">
  <div id="modelpop-search">
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.3 10.3 3.7 3.7"/></svg>
    <input id="modelpop-search-input" type="text" placeholder="Modelle suchen…" spellcheck="false" autocomplete="off" aria-label="Modelle suchen">
    <button id="modelpop-search-clear" type="button" aria-label="Suche löschen" hidden>
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
  </div>
  <div id="modelpop-body"></div>
  <div id="modelpop-foot" class="mp-strip">
    <span id="modelpop-foot-status" role="status"></span>
    <button id="modelpop-refresh" type="button" title="Modellliste aus der DSH-App neu einlesen">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.65 5.35A6 6 0 1 0 14 8"/><path d="M14 2v3.35h-3.35"/></svg>
      Aktualisieren
    </button>
  </div>
</div>
<div id="sessionspop" hidden role="dialog" aria-label="DSH-App-Sitzungen">
  <div id="sessionspop-body"></div>
</div>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
